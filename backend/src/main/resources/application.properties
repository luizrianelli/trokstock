spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
spring.datasource.username=${DB_USER:stockflow}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
stockflow.admin-password=${ADMIN_PASSWORD}
stockflow.operator-password=${OPERATOR_PASSWORD}
spring.mvc.problemdetails.enabled=true
