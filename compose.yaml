services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: ${DB_USER:?Copie .env.example para .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d stockflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/stockflow
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Defina OPERATOR_PASSWORD no .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  web:
    build: ./frontend
    depends_on: [api]
    ports:
      - "127.0.0.1:3000:80"
volumes:
  pgdata:
